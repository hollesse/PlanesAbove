# Continuous deployment (ADR 0022): test -> build images -> push to GHCR; Doco-CD (ZimaDeploy, deploy/compose.yaml) pulls them.
name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ["deploy/**"]
  workflow_dispatch:
    inputs:
      force_tts:
        description: "Rebuild the Piper image even if docker/piper did not change"
        type: boolean
        default: false

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    # Gate: nothing is published unless typecheck, unit tests, build and the Playwright E2E run are green.
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SERVICE_IMAGE: ghcr.io/hollesse/planesabove
      TTS_IMAGE: ghcr.io/hollesse/planesabove-tts
      STORYBOOK_IMAGE: ghcr.io/hollesse/planesabove-storybook
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push service image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.SERVICE_IMAGE }}:main
            ${{ env.SERVICE_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=service
          cache-to: type=gha,scope=service,mode=max

      - name: Build and push Storybook image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/storybook/Dockerfile
          push: true
          tags: |
            ${{ env.STORYBOOK_IMAGE }}:main
            ${{ env.STORYBOOK_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=storybook
          cache-to: type=gha,scope=storybook,mode=max

      - name: Decide whether the Piper image needs a build
        id: tts
        run: |
          build=false
          if [ "${{ inputs.force_tts }}" = "true" ]; then build=true; fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            build=true
          elif ! git diff --quiet "$before" "${{ github.sha }}" -- docker/piper; then
            build=true
          fi
          if ! docker manifest inspect "$TTS_IMAGE:main" >/dev/null 2>&1; then build=true; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Build and push Piper image
        if: steps.tts.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/piper
          push: true
          tags: |
            ${{ env.TTS_IMAGE }}:main
            ${{ env.TTS_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=tts
          cache-to: type=gha,scope=tts,mode=max

  # Playwright E2E (WebKit + Chromium) gates publish: a visibly broken scene must not reach the iPad (ADR 0022 amendment).
  e2e:
    needs: test
    runs-on: ubuntu-latest
    # Official Playwright image: browsers, WebKit system libraries and Node 22 are already inside, so no
    # `playwright install --with-deps` (that apt step took 5 minutes on a slow mirror). The image tag MUST
    # match the @playwright/test version in package-lock.json, otherwise Playwright downloads browsers anyway.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run e2e
