# PlanesAbove configuration (ADR 0007). Copy to config.yaml (not committed), edit, restart the container.
# Secrets (API keys, HEARTBEAT_URL) are NEVER put here - only in environment variables.

# live = real flight data (adsb.fi, failover per sources.flight.order); mock = scenario file (see scenarios/), used by the E2E tests.
mode: live
# scenario: scenarios/one-plane.json     # required when mode is mock

# REQUIRED. Sample coordinates (Frankfurt am Main) - replace with the house location.
location:
  lat: 50.05
  lon: 8.57

# Shown in the header as "Der Himmel über <place>".
place: dem Haus

radiusKm: 30               # planes within this radius are considered (30 km = 17 nm)
pollIntervalSeconds: 30    # the Takt
scene:
  slotHoldTakte: 3         # a plane keeps its slot at least this many Takte (3 = 90 s at 30 s) unless it leaves the radius or the data (ADR 0017)
port: 8080
dataDir: /data             # SQLite file + audio cache (mounted volume in Docker; default ./data)
logLevel: info             # debug | info | warn | error

# Placeholder sky until the weather module exists (ADR 0006): dawn|day|dusk|night x clear|light|overcast|fog|rain|snow|storm
sky:
  time: day
  weather: clear

# Skeleton: only the white Standard-Lackierung is drawn. Set true to use airline liveries where the catalog has one.
liveries:
  enabled: false

sources:
  userAgent: "PlanesAbove/0.1 (self-hosted, single household)"
  flight:
    timeoutMs: 5000            # per-source request timeout; on failure the next source is asked in the same Takt
    order: [adsb-fi, adsb-lol]   # failover order (ADR 0019); names without an adapter are skipped with a warning
    adsbLol:
      dailyRequestCap: 400     # adsb.lol allows 500 requests per UTC day; stay below it. Cap reached -> adsb-lol is skipped until 00:00 UTC (persisted, survives restarts)
  route:
    enabled: true
    order: [hexdb, adsbdb, vrs]  # first plausible route wins. hexdb, adsbdb = live lookups (never persisted), vrs = offline VRS standing-data snapshot (CC0) as fallback
    hexdb:
      timeoutMs: 5000          # hexdb request timeout
      backoffMinutes: 5        # skip hexdb this long after an HTTP 429
    adsbdb:
      timeoutMs: 5000          # adsbdb request timeout
      backoffMinutes: 5        # skip adsbdb this long after an HTTP 429
    snapshotRefreshHours: 24   # how often the snapshot (routes + airports, ~22 MB) is re-downloaded into dataDir
    timeoutMs: 300000          # snapshot download timeout
    cacheTtlHours: 6
    negativeTtlMinutes: 10
    flightaware:               # OPTIONAL paid last resort (ADR 0018): only used when `flightaware` is added to `order` AND the env var FLIGHTAWARE_API_KEY is set (never put the key here)
      timeoutMs: 8000
      monthlyBudgetUsd: 4.50   # hard stop per billing period (Personal tier gives up to 5 USD credit; 0.005 USD per result set)
      monthlyRequestCap: 900   # hard stop in result sets per period
      usageSyncMinutes: 30     # usage sync with /account/usage, 1..30
      usageLagMinutes: 15      # own calls of this window are added to the last synced total (usage data lags up to 10 min)
      billingPeriodStartDay: 1 # 1..28 (UTC); check against the AeroAPI portal
    plausibility:              # own-observation check of every source's route (a failing route is never stated; counted as `rejected`)
      corridorBaseKm: 50       # allowed cross-track distance to the leg: base + percent of the leg length
      corridorPercent: 8       # (CTN4456: real airways run 100 km+ off the great circle on long legs)
      corridorMaxKm: 150       # cap of the corridor, keeps far-off routes (e.g. 212 km off) rejected on very long legs
      originZoneKm: 60         # heading is only checked farther than this from the origin ...
      destinationZoneKm: 80    # ... and farther than this from the destination ...
      minHeadingCheckAltitudeM: 3000  # ... and above this altitude
      maxHeadingDeviationDeg: 65      # max angle between track and bearing to the next waypoint (0..180)
      maxClimbDistanceKm: 400  # climbing farther than this from the origin (descending: from the destination) is implausible ...
      phaseMaxAltitudeM: 8000  # ... but only below this altitude (above it vertical rates are cruise noise / step descents) ...
      phaseMinRateMs: 5        # ... and only above this vertical rate in m/s (turbulence of +-2.5 m/s does not count)
      climbMetersPerKm: 150    # altitude envelope above the origin: m per km distance (+ profileSlackM); departure routes are longer than the straight line
      descentMetersPerKm: 80   # envelope before the destination
      profileSlackM: 1500
      detourHeadingDeviationDeg: 90  # detoured leg (its great circle crosses a closed airspace): no corridor check, this heading tolerance instead of maxHeadingDeviationDeg (0..180)
      closedAirspaceSampleKm: 100    # sampling step along the great circle when testing against the polygons
      # closedAirspaces: replaces the built-in list entirely (no merge); [] disables detour detection. Defaults (12 coarse polygons, state 2026-10-27:
      # Russland, Belarus, Ukraine, Iran, Irak, Libanon, Jordanien, Persischer Golf, Syrien, Sudan, Jemen, Nordkorea) live in
      # src/server/modules/airspace/closed-airspace.ts. Review them when EASA CZIBs expire or change (https://www.easa.europa.eu/en/conflict-zone-status/active).
      # closedAirspaces:
      #   - name: Russland
      #     since: 2022-02-28
      #     note: optional free text
      #     polygon: [[69.5, 28.5], [82, 60], [82, 180], [64, 180], [43, 135], [50, 120], [50, 87], [42, 48], [46, 38], [52, 31], [56, 28], [60, 28]]  # [lat, lon], >= 3 corners
    # hexdb and vrs are always both asked (vrs is a local snapshot, no request). If the hexdb route is the tail of a VRS multi-leg route
    # (same destination, hexdb start = an intermediate stop), the VRS route wins; a real contradiction keeps the first source in `order` and is flagged as conflict.
    compareAll: false          # true = additionally always ask adsbdb and record conflicts for stats:routes; costs extra requests

# German speech (ADR 0012). piper = the `tts` sidecar container; fake = silent clip (mock/testing only).
speech:
  adapter: piper
  voice: de_DE-thorsten-medium   # must match a voice installed in the tts image (docker/piper)
  endpoint: http://tts:5000   # base URL; the adapter POSTs to <endpoint>/synthesize
  render: eager            # eager | lazy
  timeoutMs: 15000

# Settings handed to the iPad client with every state.
client:
  pollIntervalSeconds: 10
  staleAfterMinutes: 5     # client rule: no successful poll of the service for this long -> "Letzter Stand"
  reloadAt: "04:00"        # nightly reload, local time
  speechWatchdogSeconds: 60

sightings:
  visitGapMinutes: 30      # a flight absent longer than this starts a new sighting

health:
  # Flight source freshness, one threshold for both: the scene shows "Letzter Stand" and /healthz reports
  # `degraded` once the last successful fetch is older than this. Default: 3 x pollIntervalSeconds (90 s).
  # flightMaxAgeSeconds: 90
  clientSilenceMinutes: 10
