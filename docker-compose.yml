# PlanesAbove on ZimaOS (custom app) or any Docker host (ADR 0008, ADR 0022).
# Home server: `docker compose --profile tts pull && docker compose --profile tts up -d`; Watchtower then pulls every new CI build.
# Dev machine: `docker compose up -d --build` builds locally from `build:`.
# Before the first start: export PLANESABOVE_LAT, PLANESABOVE_LON and PLANESABOVE_PLACE (or put them in a .env next to this file); the defaults
# are baked into the image (repo config.yaml, ADR 0030). An optional override file goes into ./config and is named by PLANESABOVE_CONFIG_OVERRIDE.
services:
  planesabove:
    build: .
    image: ghcr.io/hollesse/planesabove:main   # built by .github/workflows/deploy.yml; rollback = sha-<commit> tag
    container_name: planesabove
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    ports:
      - "8080:8080"            # plain HTTP on the LAN only; the iPad opens http://<server>:8080/
    environment:
      TZ: ${TZ:-Europe/Berlin}  # household time zone: nightly reload, clock label
      PLANESABOVE_LAT: ${PLANESABOVE_LAT:?set PLANESABOVE_LAT (latitude of the house)}
      PLANESABOVE_LON: ${PLANESABOVE_LON:?set PLANESABOVE_LON (longitude of the house)}
      PLANESABOVE_PLACE: ${PLANESABOVE_PLACE:?set PLANESABOVE_PLACE (shown as "Der Himmel ueber <place>")}
      PLANESABOVE_RADIUS_KM: ${PLANESABOVE_RADIUS_KM:-30}
      PLANESABOVE_DATA_DIR: /data
      PLANESABOVE_SPEECH_ADAPTER: ${PLANESABOVE_SPEECH_ADAPTER:-piper}
      PLANESABOVE_SPEECH_ENDPOINT: ${PLANESABOVE_SPEECH_ENDPOINT:-http://tts:5000}   # tts sidecar: profile "tts"
      PLANESABOVE_SPEECH_VOICE: ${PLANESABOVE_SPEECH_VOICE:-}
      PLANESABOVE_FLIGHTAWARE_ENABLED: ${PLANESABOVE_FLIGHTAWARE_ENABLED:-false}
      PLANESABOVE_CONFIG_OVERRIDE: ${PLANESABOVE_CONFIG_OVERRIDE:-}   # optional, e.g. /config/override.yaml
      # Secrets only via environment (ADR 0007), never in config.yaml.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      FLIGHTAWARE_API_KEY: ${FLIGHTAWARE_API_KEY:-}
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
    volumes:
      - /DATA/AppData/planesabove/data:/data      # SQLite file (sighting log), audio cache
      - /DATA/AppData/planesabove/config:/config:ro   # optional: only for the override file
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Optional TTS sidecar (profile "tts"): docker compose --profile tts up -d --build
  # The service reaches it as http://tts:5000 (PLANESABOVE_SPEECH_ENDPOINT).
  tts:
    profiles: ["tts"]
    build: ./docker/piper
    image: ghcr.io/hollesse/planesabove-tts:main
    container_name: planesabove-tts
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Pulls new images from GHCR and recreates labelled containers (ADR 0022). Needs the Docker socket (LAN-only trade-off).
  # Image nickfedor/watchtower: maintained fork of containrrr/watchtower (unmaintained, fails against Docker Engine >= 29 with
  # "client version ... is too old"); same CLI flags, image checked 2026-10-28 (published 2026-10-22).
  watchtower:
    image: nickfedor/watchtower:1.23.2   # pinned; bump deliberately (e.g. via Renovate), Watchtower does not update itself
    container_name: planesabove-watchtower
    restart: unless-stopped
    # Configured via environment, not `command:`: the ZimaOS/Portainer import passed the command string as ONE argument
    # ("unknown flag: --label-enable --cleanup --interval 60"). Env vars arrive unchanged in every UI (ADR 0025).
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"   # only containers with com.centurylinklabs.watchtower.enable=true
      WATCHTOWER_CLEANUP: "true"        # remove the old image after an update
      WATCHTOWER_POLL_INTERVAL: "60"    # seconds
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Optional Storybook review site (profile "storybook", ADR 0008). Never opened by the iPad.
  # Build the static site first: npm run build-storybook ; then: docker compose --profile storybook up -d storybook
  storybook:
    profiles: ["storybook"]
    image: nginx:alpine
    container_name: planesabove-storybook
    restart: unless-stopped
    ports:
      - "6006:80"
    volumes:
      - ./storybook-static:/usr/share/nginx/html:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
