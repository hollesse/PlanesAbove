<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlanesAbove · Flugzeugmodelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#D8D6CC;color:#1F2A33;font-family:'IBM Plex Mono',ui-monospace,monospace;}
a{color:#1F2A33}a:hover{color:#C8313E}
.page{max-width:1200px;margin:0 auto;padding:40px 24px 80px;display:flex;flex-direction:column;gap:56px}
.head{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:0.18em;text-transform:uppercase}
h1{font-family:Archivo,sans-serif;font-weight:900;font-size:40px;margin:0;letter-spacing:-0.01em;text-transform:uppercase}
.check{display:flex;flex-direction:column;gap:18px}
.grid{display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px}
.labels{font-size:12px;letter-spacing:0.18em;text-transform:uppercase;align-items:end}
.picker{display:flex;align-items:center;gap:10px}
select{font:inherit;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;background:#ECEBE3;color:#1F2A33;border:2px solid #1F2A33;padding:4px 8px;border-radius:0}
.row{align-items:center;border-top:1px solid #1F2A33;padding-top:12px}
.meta{display:flex;flex-direction:column;gap:4px}
.name{font-weight:500;font-size:13px}
.file{font-size:11px;color:#5B6670}
.plane{background:#C9D6E1;padding:6px}
.placeholder{aspect-ratio:2.174}
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <div class="eyebrow">PlanesAbove · Illustrations-Assets</div>
    <h1>10 Typklassen · Lackierungen</h1>
  </div>

  <div class="check">
    <div class="grid labels">
      <span>Typklasse</span>
      <div class="picker">
        <span>Airline</span>
        <select id="airline">
          <option value="def">Default (weiß)</option><option value="condor">Condor</option><option value="ryan">Ryanair</option><option value="easy">easyJet</option><option value="turkish">Turkish Airlines</option><option value="af">Air France</option><option value="klm">KLM</option><option value="ba">British Airways</option><option value="wizz">Wizz Air</option><option value="iberia">Iberia</option><option value="vueling">Vueling</option><option value="sas">SAS</option><option value="ew">Eurowings</option><option value="pgs">Pegasus</option><option value="nor">Norwegian</option><option value="tap">TAP Air Portugal</option><option value="swiss">Swiss</option><option value="austrian">Austrian</option><option value="aer">Aer Lingus</option><option value="lot">LOT</option><option value="transavia">Transavia</option><option value="jet2">Jet2</option><option value="tui">TUI fly</option><option value="brussels">Brussels Airlines</option><option value="aireuropa">Air Europa</option><option value="icelandair">Icelandair</option><option value="aa">American Airlines</option><option value="delta">Delta</option><option value="united">United</option><option value="southwest">Southwest</option><option value="chinasouthern">China Southern</option><option value="airchina">Air China</option><option value="qatar">Qatar Airways</option><option value="emirates">Emirates</option><option value="aircanada">Air Canada</option><option value="etihad">Etihad</option><option value="indigo">IndiGo</option><option value="singapore">Singapore Airlines</option><option value="korean">Korean Air</option><option value="saudia">Saudia</option><option value="airindia">Air India</option><option value="lh">Lufthansa</option>
        </select>
      </div>
    </div>
    <div id="rows"></div>
  </div>
</div>

<script>
const types = [['narrowbody','Narrowbody'],['widebody','Widebody'],['jumbo-hump','Jumbo (Hump)'],['double-decker','Double-Decker'],['regional-jet','Regional-Jet'],['turboprop','Turboprop'],['business-jet','Business-Jet'],['light-aircraft','Light Aircraft'],['glider','Glider'],['helicopter','Helicopter']];

// Airlines without a livery for these small types are left empty.
const noLivery = ['light-aircraft', 'glider'];

const liveries = {
  def: {},
  condor: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-tail':'#F7A62B','--skin-stripes':'#F7A62B','--skin-engines':'#F4F4F2','--skin-wings':'#E1E3E1'},
  ryan: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#143A8F','--skin-cheatline':'#F2C230','--skin-tail':'#143A8F','--skin-engines':'#F4F4F2','--skin-wings':'#D3D6D8'},
  easy: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-tail':'#F26F28','--skin-nose':'#F26F28','--skin-engines':'#F26F28','--skin-wings':'#E1E3E1','--skin-aft-sweep-1':'#F26F28'},

  ba: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#0A2A6B','--skin-tail':'#F4F4F2','--skin-tail-wave-a':'#D7212E','--skin-tail-wave-b':'#0A2A6B','--skin-engines':'#0A2A6B','--skin-wings':'#D3D6D8'},
  wizz: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-tail':'#C6007E','--skin-engines':'#C6007E','--skin-wings':'#D3D6D8','--skin-aft-sweep-1':'#1F1F9F','--skin-aft-sweep-3':'#C6007E'},
  iberia: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-tail':'#D7192D','--skin-engines':'#F4F4F2','--skin-wings':'#D3D6D8','--skin-aft-sweep-1':'#D7192D','--skin-fin-top':'#F2B705'},
  vueling: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-tail':'#4A4F55','--skin-dots':'#4A4F55','--skin-engines':'#FFCC00','--skin-wings':'#D3D6D8'},
  sas: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-tail':'#1B2FA0','--skin-engines':'#F4F4F2','--skin-wings':'#D3D6D8','--skin-aft-sweep-2':'#1B2FA0'},
  ew: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-tail':'#F4F4F2','--skin-engines':'#D3D6D8','--skin-wings':'#D3D6D8','--skin-aft-sweep-1':'#A3134E','--skin-aft-sweep-2':'#4CC3E6','--skin-fin-top':'#4CC3E6','--skin-fin-lower':'#A3134E'},

  nor: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-tail':'#F4F4F2','--skin-engines':'#E4E5E3','--skin-wings':'#D3D6D8','--skin-nose-cap':'#D81939','--skin-nose-cap-line':'#0B1F4B','--skin-fin-top':'#D81939'},
  tap: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-tail':'#F4F4F2','--skin-engines':'#F4F4F2','--skin-wings':'#D3D6D8'},
  swiss: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-tail':'#F4F4F2','--skin-swiss-cross':'#F4F4F2','--skin-engines':'#F4F4F2','--skin-wings':'#D3D6D8','--skin-fin-field':'#E2001A'},
  austrian: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-tail':'#E3001B','--skin-engines':'#D3D6D8','--skin-wings':'#D3D6D8','--skin-aft-sweep-1':'#E3001B','--skin-fin-diagonal':'#F4F4F2'},
  aer: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-tail':'#006272','--skin-aer-edge':'#8CC63F','--skin-engines':'#006272','--skin-wings':'#D3D6D8','--skin-aft-sweep-2':'#006272'},
  lot: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-tail':'#1C1A6B','--skin-engines':'#F4F4F2','--skin-wings':'#D3D6D8','--skin-fin-base-1':'#F4F4F2','--skin-fin-base-2':'#D52B1E'},
  transavia: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-tail':'#00B865','--skin-engines':'#00B865','--skin-wings':'#D3D6D8'},
  jet2: {'--skin-fuselage':'#B9BEC3','--skin-belly':'#A9AEB3','--skin-tail':'#E3262B','--skin-engines':'#E3262B','--skin-wings':'#C9CDD1'},
  tui: {'--skin-fuselage':'#7CCBF0','--skin-belly':'#F4F4F2','--skin-tail':'#7CCBF0','--skin-engines':'#F4F4F2','--skin-wings':'#D3D6D8'},
  brussels: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-tail':'#F4F4F2','--skin-fin-dots':'#E3001B','--skin-dots':'#1E4FB4','--skin-engines':'#F4F4F2','--skin-wings':'#D3D6D8'},
  aireuropa: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-tail':'#1F6FD0','--skin-engines':'#F4F4F2','--skin-wings':'#D3D6D8'},
  icelandair: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-tail':'#1D2C8C','--skin-aer-edge':'#F6C700','--skin-engines':'#1D2C8C','--skin-wings':'#D3D6D8','--skin-aft-sweep-2':'#1D2C8C','--skin-fin-front-1':'#F6C700'},
  aa: {'--skin-fuselage':'#C9CED3','--skin-belly':'#B9BEC3','--skin-tail':'#C9CED3','--skin-engines':'#C9CED3','--skin-wings':'#D3D6D8','--skin-pattern-american-airlines-red':'#C8102E','--skin-pattern-american-airlines-blue':'#0B5FAF','--skin-pattern-american-airlines-fuselage':'#C8102E'},
  delta: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-belly-low':'#0B2A5B','--skin-tail':'#0B2A5B','--skin-engines':'#0B2A5B','--skin-wings':'#D3D6D8','--skin-fin-accent':'#C8102E'},
  united: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#E6E8EA','--skin-tail':'#1E7FD8','--skin-engines':'#1E7FD8','--skin-wings':'#D3D6D8'},
  southwest: {'--skin-fuselage':'#304CB2','--skin-belly':'#304CB2','--skin-tail':'#304CB2','--skin-window-line':'#1B2A6B','--skin-engines':'#304CB2','--skin-wings':'#C9CDD1','--skin-pattern-southwest-white':'#F4F4F2','--skin-pattern-southwest-red':'#C8102E','--skin-pattern-southwest-yellow':'#FFBF27'},
  chinasouthern: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-tail':'#1E8BD0','--skin-cheatline':'#0B3A82','--skin-engines':'#F4F4F2','--skin-wings':'#D3D6D8'},
  airchina: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#D9DCDF','--skin-tail':'#F4F4F2','--skin-cheatline':'#1C4FA0','--skin-engines':'#D9DCDF','--skin-wings':'#D3D6D8'},
  qatar: {'--skin-fuselage':'#CFCBC8','--skin-belly':'#E9E7E5','--skin-tail':'#CFCBC8','--skin-engines':'#CFCBC8','--skin-wings':'#D3D6D8','--skin-fin-accent':'#8A1538'},
  emirates: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-tail':'#F4F4F2','--skin-engines':'#F4F4F2','--skin-wings':'#D3D6D8','--skin-pattern-emirates-green':'#00843D','--skin-pattern-emirates-black':'#1A1A1A','--skin-pattern-emirates-red':'#D71920'},
  aircanada: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-belly-low':'#1A1A1A','--skin-tail':'#1A1A1A','--skin-engines':'#1A1A1A','--skin-wings':'#D3D6D8'},
  etihad: {'--skin-fuselage':'#EFE6D3','--skin-belly':'#EFE6D3','--skin-tail':'#EFE6D3','--skin-engines':'#E4E1DC','--skin-wings':'#D3D6D8','--skin-pattern-etihad-base':'#EFE6D3','--skin-pattern-etihad-grey':'#DCD8D2','--skin-pattern-etihad-gold':'#C9962B','--skin-pattern-etihad-maroon':'#7A1F2B'},
  indigo: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-tail':'#F4F4F2','--skin-ind-blue':'#232A8F','--skin-ind-light':'#5BB4E5','--skin-engines':'#232A8F','--skin-wings':'#D3D6D8'},
  singapore: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-tail':'#1D2A5C','--skin-cheatline':'#1D2A5C','--skin-cheatline2':'#F2A900','--skin-engines':'#E4E5E3','--skin-wings':'#D3D6D8','--skin-fin-back-1':'#F2A900'},
  korean: {'--skin-fuselage':'#8FCBEA','--skin-belly':'#D5D8DB','--skin-tail':'#8FCBEA','--skin-engines':'#D5D8DB','--skin-wings':'#D3D6D8'},
  saudia: {'--skin-fuselage':'#F3F1EA','--skin-belly':'#F3F1EA','--skin-tail':'#0A8A3A','--skin-cheatline':'#1FA046','--skin-cheatline2':'#1D4F91','--skin-engines':'#0A8A3A','--skin-wings':'#D3D6D8'},
  airindia: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#F4F4F2','--skin-tail':'#D9411E','--skin-engines':'#D9411E','--skin-wings':'#D3D6D8'},
  lh: {'--skin-fuselage':'#F4F4F2','--skin-belly':'#E6E8E6','--skin-tail':'#05164D','--skin-engines':'#C9CCCB','--skin-wings':'#E1E3E1','--skin-aft-sweep-1':'#05164D'}
};

const logos = {lh:'logos/lufthansa', ryan:'logos/ryanair', easy:'logos/easyjet', klm:'logos/klm', sas:'logos/sas', pgs:'logos/pegasus', tap:'logos/tap', aer:'logos/aerlingus', lot:'logos/lot', transavia:'logos/transavia', jet2:'logos/jet2', tui:'logos/tui', aireuropa:'logos/aireuropa', icelandair:'logos/icelandair', chinasouthern:'logos/chinasouthern'};

const logoFiles = ['logos/lufthansa', 'logos/ryanair', 'logos/easyjet', 'logos/klm', 'logos/sas', 'logos/pegasus', 'logos/tap', 'logos/tap-tail', 'logos/aerlingus', 'logos/lot', 'logos/transavia', 'logos/jet2', 'logos/tui', 'logos/aireuropa-tail', 'logos/icelandair-tail', 'logos/chinasouthern'];

const svg = {};
let airline = 'def';

const stripXml = s => s.replace(/<\?xml[^>]*>/, '');
// Nest a logo inside an anchor group, keeping the logo's own viewBox as its coordinate frame.
const nestKeepViewBox = s => stripXml(s).replace(/<svg [^>]*viewBox="([^"]+)"[^>]*>/, (q, vb) => { const v = vb.split(' '); return '<svg x="' + v[0] + '" y="' + v[1] + '" width="' + v[2] + '" height="' + v[3] + '" viewBox="' + vb + '" overflow="visible">'; });
// Nest a logo inside an anchor group as a 100×100 box.
const nestSquare = s => stripXml(s).replace(/<svg [^>]*>/, '<svg width="100" height="100" viewBox="0 0 100 100" overflow="visible">');
const fill = (html, cls, inner) => html.replace(new RegExp('<g class="' + cls + '"([^>]*)></g>'), (m, a) => '<g class="' + cls + '"' + a + '>' + inner + '</g>');

function render(name, vars = {}, logo) {
  const div = document.createElement('div');
  let html = svg[name];
  if (!html) { div.className = 'placeholder'; return div; }
  const lg = logo && svg[logo];
  const lgT = logo && svg[logo + '-tail'];
  if (lgT) html = fill(html, 'logo-tail-fit', nestKeepViewBox(lgT));
  if (lg && lg.includes('data-anchor="logo-tail-center"')) { html = fill(html, 'logo-tail-center', nestSquare(lg)); logo = null; }
  if (lg && lg.includes('data-anchor="logo-tail-mid"')) { html = fill(html, 'logo-tail-mid', nestSquare(lg)); logo = null; }
  if (lg && lg.includes('data-anchor="logo-tail-base"')) { html = fill(html, 'logo-tail-base', nestKeepViewBox(lg)); logo = null; }
  if (lg && lg.includes('data-anchor="logo-fuselage-fwd"')) { html = fill(html, 'logo-fuselage-fwd', nestKeepViewBox(lg)); logo = null; }
  if (lg && lg.includes('data-anchor="logo-tail-lead"')) { html = fill(html, 'logo-tail-lead', nestKeepViewBox(lg)); logo = null; }
  if (lg && logo) html = fill(html, 'logo-tail', nestSquare(lg));
  for (const [k, v] of Object.entries(vars)) div.style.setProperty(k, v);
  div.innerHTML = html;
  return div;
}

function renderRows() {
  const rows = document.getElementById('rows');
  rows.replaceChildren(...types.map(([file, name]) => {
    const row = document.createElement('div');
    row.className = 'grid row';
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = '<span class="name"></span><span class="file"></span>';
    meta.children[0].textContent = name;
    meta.children[1].textContent = file + '.svg';
    row.append(meta);
    if (!(noLivery.includes(file) && airline !== 'def')) {
      const plane = document.createElement('div');
      plane.className = 'plane';
      plane.append(render(file, liveries[airline], logos[airline] || null));
      row.append(plane);
    }
    return row;
  }));
}

document.getElementById('airline').addEventListener('change', e => { airline = e.target.value; renderRows(); });

renderRows();
Promise.all([...types.map(t => t[0]), ...logoFiles].map(async n => {
  const r = await fetch('./svg/' + n + '.svg');
  if (!r.ok) return;
  svg[n] = (await r.text()).replace('<svg ', '<svg style="display:block;width:100%;height:auto" ');
})).then(renderRows);
</script>
</body>
</html>
