# PlanesAbove for the ZimaOS home server: import via the UI ("Eigene App installieren" / custom app), no checkout, no build.
# Differences to docker-compose.yml: GHCR images only (no build:), no profiles (tts always runs), no storybook, absolute paths only.
# Configuration (ADR 0030): defaults live in the image (repo config.yaml); this file hands the per-installation values in as environment.
# Set PLANESABOVE_LAT, PLANESABOVE_LON and PLANESABOVE_PLACE in the ZimaOS environment UI (required: the import fails without them).
# Optional: put an override file at /DATA/AppData/planesabove/config/override.yaml and set PLANESABOVE_CONFIG_OVERRIDE=/config/override.yaml
# (the folder /DATA/AppData/planesabove/config may stay empty). See README, section "Konfiguration".
# Before importing, create /DATA/AppData/planesabove/{config,data}.
# Watchtower image nickfedor/watchtower: maintained fork of containrrr/watchtower, which is unmaintained and fails against
# Docker Engine >= 29 ("client version ... is too old"); same CLI flags. (ADR 0008, ADR 0022)
# No x-casaos metadata on purpose: an unverified extension block is a risk for the import; the app is reached at http://<server>:8080/.
# Explicit network `planesabove`: the ZimaOS import does not always create the Compose project network and then puts the
# containers on Docker's default bridge (172.17.0.x), where container names do NOT resolve. `http://tts:5000` fails with a
# DNS error (`speech synthesis failed`, errorClass network -> HTTP 503 on /audio/*.wav, no sound on tap). A declared,
# user-defined bridge network gives both containers name resolution; no published port is needed for container-to-container traffic.
services:
  planesabove:
    image: ghcr.io/hollesse/planesabove:main   # built by .github/workflows/deploy.yml; rollback = sha-<commit> tag
    container_name: planesabove
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    ports:
      - "8080:8080"            # plain HTTP on the LAN only; the iPad opens http://<server>:8080/
    networks: [planesabove]
    depends_on: [tts]
    environment:
      TZ: Europe/Berlin        # household time zone: nightly reload, clock label, month of the speech budget
      PLANESABOVE_LAT: ${PLANESABOVE_LAT:?set PLANESABOVE_LAT (latitude of the house)}
      PLANESABOVE_LON: ${PLANESABOVE_LON:?set PLANESABOVE_LON (longitude of the house)}
      PLANESABOVE_PLACE: ${PLANESABOVE_PLACE:?set PLANESABOVE_PLACE (shown as "Der Himmel ueber <place>")}
      PLANESABOVE_RADIUS_KM: ${PLANESABOVE_RADIUS_KM:-30}
      PLANESABOVE_DATA_DIR: /data
      PLANESABOVE_SPEECH_ADAPTER: ${PLANESABOVE_SPEECH_ADAPTER:-piper}
      PLANESABOVE_SPEECH_ENDPOINT: http://tts:5000
      PLANESABOVE_SPEECH_VOICE: ${PLANESABOVE_SPEECH_VOICE:-}              # elevenlabs: voice_id (required there); empty = piper default voice
      PLANESABOVE_FLIGHTAWARE_ENABLED: ${PLANESABOVE_FLIGHTAWARE_ENABLED:-false}   # opt-in, costs money; a stored key alone does not switch it on
      PLANESABOVE_CONFIG_OVERRIDE: ${PLANESABOVE_CONFIG_OVERRIDE:-}        # optional, e.g. /config/override.yaml
      # Secrets: set them in the ZimaOS environment UI, never write them into this file.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      FLIGHTAWARE_API_KEY: ${FLIGHTAWARE_API_KEY:-}
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
    volumes:
      - /DATA/AppData/planesabove/data:/data      # SQLite file (sighting log), audio cache
      - /DATA/AppData/planesabove/config:/config:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Piper TTS sidecar, reached as http://tts:5000 (PLANESABOVE_SPEECH_ENDPOINT above)
  tts:
    image: ghcr.io/hollesse/planesabove-tts:main
    container_name: planesabove-tts
    restart: unless-stopped
    networks: [planesabove]      # reached only as http://tts:5000 from the service container; no port published to the LAN
    labels:
      - com.centurylinklabs.watchtower.enable=true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Pulls new images from GHCR every 5 minutes and recreates labelled containers only. Needs the Docker socket (LAN-only trade-off).
  watchtower:
    image: nickfedor/watchtower:1.23.2   # pinned; bump deliberately (e.g. via Renovate), Watchtower does not update itself
    container_name: planesabove-watchtower
    restart: unless-stopped
    # Configured via environment, not `command:`: the ZimaOS/Portainer import passed the command string as ONE argument
    # ("unknown flag: --label-enable --cleanup --interval 60"). Env vars arrive unchanged in every UI (ADR 0025).
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"   # only containers with com.centurylinklabs.watchtower.enable=true
      WATCHTOWER_CLEANUP: "true"        # remove the old image after an update
      WATCHTOWER_POLL_INTERVAL: "60"    # seconds
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  planesabove:
    name: planesabove
    driver: bridge
