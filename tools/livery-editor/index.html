<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Lackierungs-Editor</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 0; display: flex; height: 100vh; background: #ECEBE3; color: #1F2A33; }
    #panel { width: 320px; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; background: #F4F4F2; border-right: 1px solid #C9CCCB; overflow-y: auto; }
    #panel label { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #panel h2 { font-size: 12px; text-transform: uppercase; margin: 8px 0 0; letter-spacing: .06em; }
    #stage { flex: 1; padding: 24px; overflow: auto; }
    #board { position: relative; width: 900px; background: #D8D6CC; }
    #board svg { display: block; width: 100%; height: auto; }
    #board svg.overlay { position: absolute; inset: 0; cursor: crosshair; }
    #status { min-height: 1.4em; }
    #status.error { color: #b00020; }
    .layer-row { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border: 1px solid transparent; border-radius: 4px; }
    .layer-row.selected { border-color: #0a84ff; background: #e6f0ff; }
    .layer-row .swatch { width: 22px; height: 22px; padding: 0; border: 1px solid #888; background: none; flex: none; cursor: pointer; }
    .layer-row .layer-name-input { flex: 1; min-width: 0; box-sizing: border-box; height: 26px; }
    .layer-row .layer-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; height: 26px; }
    .icon-btn { padding: 0; width: 22px; height: 22px; font-size: 14px; line-height: 1; flex: none; }
    .layer-row .layer-label { flex: 1; text-align: left; background: none; border: 0; cursor: pointer; }
    .layer-row { min-height: 26px; }
    .layer-actions { display: flex; gap: 2px; flex: none; max-width: 0; overflow: hidden; opacity: 0; pointer-events: none; transition: opacity 100ms, max-width 100ms; }
    .layer-row:hover .layer-actions, .layer-row.selected .layer-actions, .layer-row.editing .layer-actions, .layer-row:focus-within .layer-actions { max-width: 120px; opacity: 1; pointer-events: auto; }
    .layer-actions .icon-btn { background: none; border: 1px solid transparent; }
    .layer-actions .icon-btn:hover:not(:disabled), .layer-actions .icon-btn:focus-visible { background: #fff; border-color: #888; }
    #sighting-list { flex: none; display: flex; flex-direction: column; gap: 2px; max-height: 220px; overflow-y: auto; }
    #sighting-list .error { color: #b00020; }
    .sighting-row { display: flex; gap: 8px; align-items: center; text-align: left; padding: 4px 6px; background: #fff; border: 1px solid #C9CCCB; cursor: pointer; }
    .sighting-row.selected { border-color: #0a84ff; background: #e6f0ff; }
    .sighting-row .sighting-airline { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gap-badge { background: #fbe3a5; color: #5a3b00; border-radius: 3px; padding: 0 5px; font-size: 11px; font-weight: 600; }
    input[aria-invalid="true"] { outline: 2px solid #b00020; }
    button { padding: 6px 10px; }
  </style>
</head>
<body>
  <div id="panel"></div>
  <div id="stage"><div id="board"></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
